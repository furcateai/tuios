# Furcate OS: the interface, as the distribution ships it.
#
# Installed to /etc/xdg/tuios/config.toml, the system config directory
# XDG_CONFIG_DIRS names on this distribution, so an operator's own
# ~/.config/tuios/config.toml overrides it key by key. Nothing here is locked:
# this is what a machine looks like before anybody has an opinion.

[appearance]
# The distribution's own palette, compiled into the binary. See
# internal/theme/furcate.go; it is generated from the same OKLCH definition that
# paints the login banner and the shell prompt, so all three are one brand.
#
# On the machine's own screen the theme is not applied as RGB. A Linux VT has
# sixteen colours, so furcate-vtpalette@.service repaints those sixteen slots
# with the theme's own values and TERM is set to linux-16color — Ubuntu's plain
# `linux` entry declares colors#8, which folded the palette to eight and put
# every bright colour on the wrong slot. From then on the indices *are* the
# brand. Over SSH the theme applies directly.
theme = "furcate"

# Square corners. The views draw with box rules and filled bars, and rounded
# window corners around square content reads as two designs stacked.
border_style = "normal"

# The rail down the side is the navigation.
#
# Without it there is no way to see what else exists: an operator looking at
# four panes has no idea there are other sessions, other machines, or anything
# behind them. This is the part that makes the interface navigable rather than
# a fixed dashboard somebody has to already know the keys for.
# `s` in window mode focuses the rail, `Tab` moves between its sections and
# `Enter` opens what is under the cursor. Getting back to the panes is `Esc`.
# Without knowing `s` the rail is visible and unreachable, which is how it first
# looked here.
[appearance.sidebar]
enabled = true
position = "left"
width = 26
# Sessions first, because on a controller that list is the cluster. Then the
# windows in the one you are looking at. Files last and small — an operations
# screen is not a file manager, but a deploy that needs a path is common enough
# that removing it entirely would be its own annoyance.
sections = "sessions:30,terminals:45,files:25"
show_glyphs = true
show_counts = true
tooltips = true
# Navigate rather than cd: clicking a folder in an operations rail should move
# the listing, not silently change the working directory of whatever pane
# happens to be focused.
folder_click = "navigate"
# Off. Every Furcate action needs an operator signature over a nonced order, and
# a rail that can delete files is a way around that for anything on disk.
file_actions = false

# The mouse works, where the terminal has one.
#
# Over SSH from a real terminal this is immediate. On the machine's own console
# it needs gpm, which the package recommends and the postinst reports on: a VT
# has no mouse of its own, so tuios has none to receive.
focus_follows_mouse = false
alt_drag = true
click_to_type = "single"

# Long enough to hold a boot, a build, or a journal dump read backwards, which
# is the reason an operator scrolls at all.
scrollback_lines = 50000

[startup]
# The views are opened by the login script, which knows which machine this is.
# A default window would put a bare shell in front of them.
open_default_window = false

# Tiled from the first pane. A floating window that has to be moved is a
# desktop's idea; every pane here should be visible without arranging anything.
tiled = true

# Window-management mode. The first thing an operator does is look, and the keys
# that navigate should work before the keys that type.
start_in_terminal_mode = false

layout = "bsp"

# A bare `tuios` attaches to the daemon rather than running standalone, so a
# dropped connection is reattached to rather than lost.
daemon = true

[dock]
# The bar is where the keys are.
#
# `mode` says which mode the interface is in, which is the single most useful
# thing on screen for somebody who has not learned the modal model yet.
# `workspaces` shows the pages and which one is current. `windows` names the
# panes. Between them an operator can see what exists and what will move.
left   = ["mode", "workspaces"]
center = ["windows"]
right  = ["custom/power", "custom/findings", "custom/site", "cpu", "ram", "clock", "session-controls"]

[dock.clock]
# Seconds, because a screen watched during an incident should visibly be live.
# A clock that has stopped is the first sign the session behind it has.
format = "15:04:05"

# --- what Furcate puts on the bar -------------------------------------------
#
# Each is a command whose first line becomes a cell: environment in, one line
# out, no API behind it that a release could break. They paint themselves from
# /usr/share/furcate/palette.sh, so the design language is stated once.
#
# All read-only. The console reads and furcatectl acts, and a status bar with a
# lever on it would be a hole in the authority model wearing a convenient shape.

[dock.custom.power]
command = "/opt/furcate/tui/bin/furcatectl dock power 2>/dev/null"
refresh = "10s"
max-width = 16

[dock.custom.findings]
command = "/opt/furcate/tui/bin/furcatectl dock findings 2>/dev/null"
refresh = "30s"
max-width = 20

[dock.custom.site]
command = "/opt/furcate/tui/bin/furcatectl dock site 2>/dev/null"
refresh = "event:after-attach"
max-width = 28

[hooks]
# The site cell is stale the moment a session is picked up somewhere else, and
# an operator reattaching from a different machine is exactly who most needs it
# right. after-attach is a client event, so it fires per attach.
after-attach = "/opt/furcate/tui/bin/furcatectl dock refresh site 2>/dev/null || true"
